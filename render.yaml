# Render Blueprint: the API only (the site is on GitHub Pages).
#
# Plan note: keep `plan: free` so blueprint sync succeeds without a paid plan.
# Free web services cannot attach persistent disks (Render rejects the blueprint).
# Upgrade to starter (or higher) in the Render dashboard if you want a warmer
# demo; after upgrading you can optionally add a disk and remount paths under
# /var/data. Blueprint alone cannot upgrade billing.
#
# Live data: startCommand runs scripts/fetch_live_db.py. Set CDC_DB_URL in the
# Render dashboard once to the cdc-data-latest release asset, e.g.
# https://github.com/NeelVadlamudi/cdc-outbreak-dashboard/releases/download/cdc-data-latest/cdc_surveillance.duckdb
# (Actions also keeps artifact cdc-duckdb). If unset or fetch fails, the script
# copies evals/snapshot.duckdb. /tmp is ephemeral (wiped on restart/spin-down);
# that is expected on free tier.
services:
  - type: web
    name: cdc-outbreak-api
    runtime: python
    # Free: no persistent disk. Paid plan + disk is optional later for /var/data.
    plan: free
    buildCommand: pip install -r requirements-render.txt
    startCommand: python scripts/fetch_live_db.py --dest /tmp/cdc_surveillance.duckdb && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: CDC_DB_PATH
        value: /tmp/cdc_surveillance.duckdb
      # Public release asset (not a secret). Blueprint sync sets this so free-tier
      # boots pull the twice-daily DuckDB without a manual dashboard step.
      - key: CDC_DB_URL
        value: https://github.com/NeelVadlamudi/cdc-outbreak-dashboard/releases/download/cdc-data-latest/cdc_surveillance.duckdb
      - key: INGEST_ON_STARTUP
        value: "false"
      - key: AGENT_MODEL
        value: gemini-flash-lite
      - key: ALLOWED_ORIGINS
        value: https://neelvadlamudi.github.io
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO
      - key: ENABLE_API_DOCS
        value: "false"
      - key: RATE_LIMIT_BACKEND
        value: sqlite
      # Ephemeral on free tier; resets on restart. Move under /var/data only after
      # upgrading off free and attaching a persistent disk.
      - key: RATE_LIMIT_DB
        value: /tmp/ratelimits.sqlite
      # Optional: set RATE_LIMIT_BACKEND=redis and REDIS_URL if you provision Redis.

services:
  # Python Backend Service
  - type: web
    name: cdc-outbreak-api
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.0
      # Required for downloading/updating CDC datasets on production
      - key: APP_ENV
        value: production
      # Set to the frontend's public URL in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false
      - key: ADMIN_API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: INFO

  # React Frontend Service
  - type: web
    name: cdc-outbreak-dashboard
    env: static
    buildCommand: "cd frontend && npm install && npm run build"
    staticPublishPath: "./frontend/dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: cdc-outbreak-api
          envVarKey: RENDER_EXTERNAL_URL
        # Appends /api to the end of the URL
        property: url_with_path
        value: /api
      - key: NODE_VERSION
        value: 18.17.0

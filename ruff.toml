target-version = "py310"
line-length = 120
extend-exclude = ["frontend"]

[lint]
select = ["E", "F", "W", "I"]
# Long SQL strings and chart labels are left as they are for now.
ignore = ["E501"]

[lint.per-file-ignores]
# DataFrames here are read by DuckDB by variable name.
"evals/build_snapshot.py" = ["F841"]

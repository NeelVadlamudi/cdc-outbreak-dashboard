# Eval questions, answered against evals/snapshot.duckdb (see build_snapshot.py).
# type: number   -> expected_sql returns one value; correct if the answer has a
#                   number within tolerance (absolute) of it
# type: multi    -> needs more than one tool; expected_sql returns one row,
#                   every value must be in the answer within tolerance
# type: refusal  -> the data cannot answer it; correct if the agent declines
#                   and gives no number
# Snapshot window: weeks ending 2026-07-25 to 2026-10-10. wastewater_activity (current NWSS
# viral activity levels) covers the same weeks; wastewater_sites (legacy NWSS metrics) ends 2025-09-07.
# Hospitalization rates are per 100,000, overall population unless stated.

snapshot: evals/snapshot.duckdb

questions:
  # ---- single number ----
  - id: n01
    type: number
    question: What was COVID-19 test positivity for the latest week?
    expected_sql: SELECT percent_test_positivity FROM test_positivity WHERE pathogen = 'COVID-19' AND week_end = (SELECT MAX(week_end) FROM test_positivity)
    tolerance: 0.05
    expected_tools:
    - get_test_positivity
  
  - id: n02
    type: number
    question: What was influenza test positivity for the week ending October 3, 2026?
    expected_sql: SELECT percent_test_positivity FROM test_positivity WHERE pathogen = 'Influenza' AND week_end = DATE '2026-10-03'

    question: By how many percentage points did COVID-19 test positivity change from the week ending September 26 to the week ending October 10, 2026?
    expected_sql: SELECT ROUND(MAX(CASE WHEN week_end = DATE '2026-10-10' THEN percent_test_positivity END) - MAX(CASE WHEN week_end = DATE '2026-09-26' THEN percent_test_positivity END), 1) FROM test_positivity WHERE pathogen = 'COVID-19'
    tolerance: 0.05
    expected_tools:

name: nightly

# Refresh CDC data, run the backtest, the 60-question eval and the 30-question Mirage audit eval, publish results to site/data,
# write site/data/status.json, and open issues for score drops, stale tables or failed steps.
on:
  schedule:
    - cron: "17 9 * * *"  # 09:17 UTC daily
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CDC_DB_PATH: ${{ github.workspace }}/data/cdc_surveillance.duckdb
      LOG_FORMAT: json
      EVAL_MODEL: gemini-3.5-flash-lite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: refresh
        name: Refresh CDC data
        continue-on-error: true
        run: python scripts/refresh_data.py

      - id: backtest
        name: Backtest on the refreshed data
        continue-on-error: true
        run: python evals/backtest.py --db "$CDC_DB_PATH" --site-out site/data/backtest.json

      - id: dashboard
        name: Dashboard metrics
        continue-on-error: true
        run: python scripts/build_dashboard.py --db "$CDC_DB_PATH"

      - id: eval
        name: Eval (60 questions on the frozen snapshot)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY secret is not set"; exit 1; fi
          cp evals/snapshot.duckdb /tmp/snap.duckdb
          CDC_DB_PATH=/tmp/snap.duckdb INGEST_ON_STARTUP=false \
            python -m uvicorn backend.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
          python evals/run_evals.py --model "$EVAL_MODEL" --url http://127.0.0.1:8000
          f=$(ls -t evals/results/"$EVAL_MODEL"_*.json | head -1)
          echo "result=$f" >> "$GITHUB_OUTPUT"
          python scripts/publish_eval.py "$f"

      - id: mirage
        name: Mirage audit eval (30 questions)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY secret is not set"; exit 1; fi
          python mirage/vendor/scripts/verify_kpis.py
          python mirage/vendor/scripts/verify_allocation.py
          python evals/mirage/run_mirage_evals.py --model "$EVAL_MODEL"
          f=$(ls -t evals/mirage/results/"$EVAL_MODEL"_*.json | head -1)
          echo "result=$f" >> "$GITHUB_OUTPUT"
          python scripts/publish_mirage.py "$f"

      - id: status
        name: Write status.json
        if: always()
        run: |
          python scripts/nightly_status.py --db "$CDC_DB_PATH" \
            --eval-result "${{ steps.eval.outputs.result }}" \
            --step refresh=${{ steps.refresh.outcome }} \
            --step backtest=${{ steps.backtest.outcome }} \
            --step dashboard=${{ steps.dashboard.outcome }} \
            --step eval=${{ steps.eval.outcome }} \
            --step mirage_eval=${{ steps.mirage.outcome }} \
            --mirage-result "${{ steps.mirage.outputs.result }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" --started-at "${{ steps.start.outputs.at }}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "NeelVadlamudi"
          git config user.email "73226768+NeelVadlamudi@users.noreply.github.com"
          git add evals/results evals/mirage/results site/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Nightly results $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Deploy the site
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main

      - name: Open alert issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/open_alerts.py site/data/status.json

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/server.log
          if-no-files-found: ignore

      - name: Fail the run if a step failed
        if: always()
        run: |
          python -c "import json,sys; r=json.load(open('site/data/status.json'))['run']['result']; print('result:', r); sys.exit(r == 'failure')"

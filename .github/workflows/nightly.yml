name: nightly

# Twice-daily CDC refresh + release. Full eval/backtest on the morning run
# (and on workflow_dispatch); evening run = refresh + release + dashboard JSON.
on:
  schedule:
    - cron: "17 9,21 * * *"  # 09:17 and 21:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CDC_DB_PATH: ${{ github.workspace }}/data/cdc_surveillance.duckdb
      LOG_FORMAT: json
      EVAL_MODEL: gemini-3.5-flash-lite
      # The eval sends 60 questions in a few minutes to a local server; the public limits are for Render.
      RATE_LIMITS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      - id: start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - id: schedule
        name: Decide full vs refresh-only
        run: |
          HOUR=$(date -u +%-H)
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "$HOUR" -lt 15 ]; then
            echo "full=true" >> "$GITHUB_OUTPUT"
            echo "mode=full (eval + backtest)"
          else
            echo "full=false" >> "$GITHUB_OUTPUT"
            echo "mode=refresh-only (evening)"
          fi

      - id: refresh
        name: Refresh CDC data
        continue-on-error: true
        run: python scripts/refresh_data.py

      - name: Publish live DuckDB artifact
        if: steps.refresh.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: cdc-duckdb
          path: ${{ env.CDC_DB_PATH }}
          if-no-files-found: error
          retention-days: 14

      # Hard-fail on upload problems so a broken release is never a silent green run.
      - id: release
        name: Upload DuckDB to cdc-data-latest release
        if: steps.refresh.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ ! -f "$CDC_DB_PATH" ]; then
            echo "DuckDB missing after successful refresh: $CDC_DB_PATH" >&2
            exit 1
          fi
          if ! gh release view cdc-data-latest >/dev/null 2>&1; then
            gh release create cdc-data-latest \
              --title "CDC data (latest)" \
              --notes "Twice-daily refreshed DuckDB for the live API (tag cdc-data-latest). Replaced on each successful refresh. Set Render CDC_DB_URL to the asset URL."
          fi
          gh release upload cdc-data-latest "$CDC_DB_PATH" --clobber
          echo "Published $(basename "$CDC_DB_PATH") to release tag cdc-data-latest"

      - id: backtest
        name: Backtest on the refreshed data
        if: steps.schedule.outputs.full == 'true'
        continue-on-error: true
        run: python evals/backtest.py --db "$CDC_DB_PATH" --site-out site/data/backtest.json

      - id: dashboard
        name: Dashboard metrics
        continue-on-error: true
        run: python scripts/build_dashboard.py --db "$CDC_DB_PATH"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: static
        name: Export read-only app data
        if: steps.refresh.outcome == 'success'
        run: |
          python scripts/export_static.py --db "$CDC_DB_PATH"
          python scripts/static_provenance.py --db "$CDC_DB_PATH"
          node scripts/validate_static.mjs

      - name: Keep the complete static generation
        if: steps.static.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: static-dashboard
          path: site/data/static
          if-no-files-found: error
          retention-days: 30

      - id: eval
        name: Eval (60 questions on the frozen snapshot)
        if: steps.schedule.outputs.full == 'true'
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY secret is not set"; exit 1; fi
          cp evals/snapshot.duckdb /tmp/snap.duckdb
          CDC_DB_PATH=/tmp/snap.duckdb INGEST_ON_STARTUP=false \
            python -m uvicorn backend.main:app --port 8000 > /tmp/server.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8000/ > /dev/null && break; sleep 1; done
          python evals/run_evals.py --model "$EVAL_MODEL" --url http://127.0.0.1:8000
          f=$(ls -t evals/results/"$EVAL_MODEL"_*.json | head -1)
          echo "result=$f" >> "$GITHUB_OUTPUT"
          python scripts/publish_eval.py "$f"

      - id: status
        name: Write status.json
        if: always()
        run: |
          python scripts/nightly_status.py --db "$CDC_DB_PATH" \
            --eval-result "${{ steps.eval.outputs.result }}" \
            --step refresh=${{ steps.refresh.outcome }} \
            --step release=${{ steps.release.outcome || 'skipped' }} \
            --step backtest=${{ steps.backtest.outcome || 'skipped' }} \
            --step dashboard=${{ steps.dashboard.outcome }} \
            --step eval=${{ steps.eval.outcome || 'skipped' }} \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --commit "${{ github.sha }}" --started-at "${{ steps.start.outputs.at }}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "NeelVadlamudi"
          git config user.email "73226768+NeelVadlamudi@users.noreply.github.com"
          git add evals/results site/data
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "Nightly results $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Open alert issues
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/open_alerts.py site/data/status.json

      - name: Keep the server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-log
          path: /tmp/server.log
          if-no-files-found: ignore

      - name: Fail the run if a step failed
        if: always()
        run: |
          # Release upload must never look green when it failed (status.json + explicit check).
          if [ "${{ steps.refresh.outcome }}" = "success" ] && [ "${{ steps.release.outcome }}" = "failure" ]; then
            echo "Release upload failed after a successful refresh" >&2
            exit 1
          fi
          python -c "import json,sys; r=json.load(open('site/data/status.json'))['run']['result']; print('result:', r); sys.exit(r == 'failure')"

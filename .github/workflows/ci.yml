name: ci

on:
  push:
  pull_request:

permissions: { contents: read }

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ""
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: make test
      - name: Grounding gate (when eval artifacts present)
        # Uses the same >5pt drop rule as nightly alerts. Skips when no matching
        # evals/results/*.json is in the tree (typical PR). Set EVAL_RESULT_PATH
        # to force a specific artifact. Do not invent a nightly eval here.
        run: python scripts/check_grounding_gate.py

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npx eslint .
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Node tests
        working-directory: frontend
        run: npm run test:contract && npm run test:charts && npm run test:layout
      - name: Site fixture tests
        run: node --test tests/site-fixtures/*.test.mjs
      - name: Frontend smoke
        working-directory: frontend
        run: npm run smoke
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install local static test backend
        run: pip install -r requirements-render.txt pytest
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Static snapshot and cold browser checks
        run: scripts/check_static.sh

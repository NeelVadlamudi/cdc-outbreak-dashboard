name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "frontend/**", ".github/workflows/pages.yml"]
  workflow_run:
    workflows: [nightly]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      data_run_id:
        description: Nightly run with a complete static-dashboard artifact (blank uses latest)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success')
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install public database validator
        run: pip install 'duckdb>=1.2'
      - name: Build React app under /app/
        working-directory: frontend
        env:
          APP_BASE: /cdc-outbreak-dashboard/app/
        run: npm ci && npm run build
      - name: Assemble site with app
        run: |
          mkdir -p _site
          cp -r site/. _site/
          rm -rf _site/data/static
          cp -r frontend/dist _site/app
          # Pages has no SPA fallback, so give each route its own entry file.
          for r in ask map forecasts analytics simulator wastewater advanced; do
            mkdir -p "_site/app/$r" && cp _site/app/index.html "_site/app/$r/index.html"
          done
      - id: data-run
        name: Select a complete static generation
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_RUN_ID: ${{ github.event.workflow_run.id || inputs.data_run_id }}
        run: python scripts/select_static_run.py
      - name: Download public app data
        uses: actions/download-artifact@v4
        with:
          name: static-dashboard
          path: _site/data/static
          github-token: ${{ github.token }}
          run-id: ${{ steps.data-run.outputs.run_id }}
      - name: Validate generation before publishing
        env:
          STATIC_NIGHTLY_RUN_ID: ${{ steps.data-run.outputs.run_id }}
          STATIC_NIGHTLY_RUN_ATTEMPT: ${{ steps.data-run.outputs.run_attempt }}
          STATIC_NIGHTLY_COMMIT: ${{ steps.data-run.outputs.head_sha }}
        run: node scripts/validate_static.mjs _site/data/static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4

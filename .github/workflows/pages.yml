name: pages

on:
  push:
    branches: [main]
    paths: ["site/**", "frontend/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
    inputs:
      data_run_id:
        description: Nightly run with a complete static-dashboard artifact (blank uses latest)
        required: false
        type: string

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build React app under /app/
        working-directory: frontend
        env:
          APP_BASE: /cdc-outbreak-dashboard/app/
        run: npm ci && npm run build
      - name: Assemble site with app
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r frontend/dist _site/app
          # Pages has no SPA fallback, so give each route its own entry file.
          for r in ask map forecasts analytics simulator wastewater advanced; do
            mkdir -p "_site/app/$r" && cp _site/app/index.html "_site/app/$r/index.html"
          done
      - id: data-run
        name: Select a complete static generation
        env:
          GH_TOKEN: ${{ github.token }}
          DATA_RUN_ID: ${{ inputs.data_run_id }}
        run: |
          set -euo pipefail
          run_id="$DATA_RUN_ID"
          if [ -z "$run_id" ]; then
            run_id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=static-dashboard&per_page=100" \
              --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id // empty')
          fi
          [[ "$run_id" =~ ^[0-9]+$ ]] || { echo "No complete static data artifact; leaving Pages unchanged"; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download public app data
        uses: actions/download-artifact@v4
        with:
          name: static-dashboard
          path: _site/data/static
          github-token: ${{ github.token }}
          run-id: ${{ steps.data-run.outputs.run_id }}
      - name: Validate generation before publishing
        run: node scripts/validate_static.mjs _site/data/static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
